<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Focus</title>
<meta name="description" content="Private, offline to-dos for work and personal life. Data never leaves this device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body data-view="home">
<header class="topbar" id="topbar"></header>
<main id="main"></main>

<form id="qa" class="quickadd" autocomplete="off" novalidate>
  <div class="qa-chips" id="qaChips"></div>
  <div class="qa-row">
    <input id="qaInput" type="text" enterkeyhint="done" placeholder="Add a task… try “Send deck fri !”" autocapitalize="sentences" aria-label="New task">
    <button type="submit" class="qa-add" aria-label="Add task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</form>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-view="work"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 12.5h17"/></svg><span>Work</span></button>
  <button data-view="personal"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><span>Personal</span></button>
  <button data-view="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19.5 6v5.5c0 4.6-3.2 7.8-7.5 9-4.3-1.2-7.5-4.4-7.5-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg><span>Data</span></button>
</nav>

<div class="overlay" id="overlay" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript><p class="noscript">Focus needs JavaScript enabled.</p></noscript>
</body>
</html>
